{% extends 'courses/base.html' %}

{% block title %}Вход для администратора - Учусь.РФ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="mb-4">Администратор</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_password" class="form-label">Пароль администратора</label>
                <input type="password" name="password" class="form-control" id="id_password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
